<!doctype html>
<meta charset="utf-8"><title>Gemiverse long film: drawn scenes</title>
<style>html,body{margin:0;background:#faf8f5;overflow:hidden}svg{display:block;width:1920px;height:1080px}text{font-family:"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Every concept and chart of the long film, drawn as the thing itself in motion. No slides.
// A scene is a pure function of time: seek(id, t, T, lang) redraws the whole picture, so frames can be captured one by one.
// Preview: long.html?s=s5a&lang=zh  (plays in real time over ?d= seconds, default 20)
const INK = "#2b2536", SOFT = "#6b6478", GOLD = "#ffc233", LILAC = "#7c4dce", RED = "#d9534f", GREEN = "#3f9b57", PAPER = "#fffdf8", LINE = "#e6dfd3";
let LANG = "zh";
const L = (zh, en) => (LANG === "zh" ? zh : en);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), ez = (x) => { x = cl(x); return x * x * (3 - 2 * x); };
const seg = (p, a, b) => ez((p - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const txt = (x, y, s, size = 40, o = {}) => `<text x="${x}" y="${y}" font-size="${o.raw ? size : Math.max(28, size)}" fill="${o.fill ?? INK}" font-weight="${o.w ?? 500}" text-anchor="${o.a ?? "start"}" opacity="${o.op ?? 1}" ${o.ls ? `letter-spacing="${o.ls}"` : ""}>${esc(s)}</text>`;
const box = (x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r ?? 14}" fill="${o.fill ?? PAPER}" stroke="${o.stroke ?? INK}" stroke-width="${o.sw ?? 3}" opacity="${o.op ?? 1}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ""}/>`;
const ln = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke ?? INK}" stroke-width="${o.sw ?? 3}" opacity="${o.op ?? 1}" stroke-linecap="round" ${o.dash ? `stroke-dasharray="${o.dash}"` : ""}/>`;
const dot = (x, y, r, fill, o = {}) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${o.stroke ?? "none"}" stroke-width="${o.sw ?? 0}" opacity="${o.op ?? 1}"/>`;
const star = (x, y, r, o = {}) => { let d = ""; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5 + (o.rot ?? 0), q = i % 2 ? r * 0.46 : r; d += `${i ? "L" : "M"}${(x + Math.cos(a) * q).toFixed(1)} ${(y + Math.sin(a) * q).toFixed(1)}`; }
  return `<path d="${d}Z" fill="${o.fill ?? GOLD}" stroke="${o.stroke ?? INK}" stroke-width="${o.sw ?? 2.5}" stroke-linejoin="round" opacity="${o.op ?? 1}"/>`; };
const tick = (x, y, r, k = 1, col = GREEN) => `<path d="M${x - r * 0.5} ${y} L${x - r * 0.1} ${y + r * 0.4} L${x + r * 0.55} ${y - r * 0.4}" fill="none" stroke="${col}" stroke-width="${r * 0.22}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${r * 2}" stroke-dashoffset="${r * 2 * (1 - k)}"/>`;
const jar = (x, y, w, h, label, n, o = {}) => { let s = `<rect x="${x + w * 0.2}" y="${y - 22}" width="${w * 0.6}" height="24" rx="6" fill="#c89462" stroke="${INK}" stroke-width="3"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="#ffffffaa" stroke="${INK}" stroke-width="3"/>`;
  for (let i = 0; i < n; i++) { const col = i % 3, row = Math.floor(i / 3); s += star(x + w * (0.25 + col * 0.25) + (row % 2 ? 8 : -6), y + h - 34 - row * 46, 21, { fill: o.fill ?? GOLD, rot: i * 0.6 }); }
  return s + txt(x + w / 2, y + h + 50, label, 34, { a: "middle", w: 600 }); };
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const img = (href, k, fx = 0.5, fy = 0.5, op = 1) => `<image href="${href}" x="${-1920 * (k - 1) * fx}" y="${-1080 * (k - 1) * fy}" width="${1920 * k}" height="${1080 * k}" preserveAspectRatio="xMidYMid slice" opacity="${op}"/>`;
const title = (op, y = 560) => `<g opacity="${op}"><text x="960" y="${y}" font-size="150" font-weight="700" text-anchor="middle" letter-spacing="-3"><tspan fill="#ffd98a">Gemi</tspan><tspan fill="#d9c4ff">verse</tspan></text></g>`;
const bars = (items, x0, base, H, max, k, o = {}) => items.map((it, i) => { const h = H * it.v / max * k, x = x0 + i * (o.gap ?? 260), w = o.w ?? 150; return box(x, base - h, w, h, { fill: it.fill, r: 10 }) + txt(x + w / 2, base - h - 22, (it.v * k).toFixed(1) + "%", 54, { a: "middle", w: 700, fill: it.col ?? INK }) + txt(x + w / 2, base + 52, it.label, 30, { a: "middle", fill: SOFT }) + (it.sub ? txt(x + w / 2, base + 92, it.sub, 26, { a: "middle", fill: SOFT }) : ""); }).join("") + ln(x0 - 60, base, x0 + items.length * (o.gap ?? 260), base);

// ---------- the day strip used in s1 and s5d
const DAY = [["课", "class", "#b9c8f2"], ["课", "class", "#b9c8f2"], ["课", "class", "#b9c8f2"], ["饭", "lunch", "#f3d9b0"], ["课", "class", "#b9c8f2"], ["课", "class", "#b9c8f2"], ["作业", "homework", "#d8c6f1"], ["作业", "homework", "#d8c6f1"], ["打工", "job", "#f2c0b5"], ["打工", "job", "#f2c0b5"], ["打工", "job", "#f2c0b5"], ["饭", "dinner", "#f3d9b0"], ["作业", "homework", "#d8c6f1"], ["", "", GOLD], ["", "", GOLD], ["睡", "sleep", "#d9d6de"]];
const dayStrip = (x, y, w, h, k, o = {}) => DAY.map((d, i) => { const on = cl(k * DAY.length - i), free = d[2] === GOLD, bw = w / DAY.length; return `<g opacity="${on}">` + box(x + i * bw + 3, y, bw - 6, h, { fill: free ? "#fff3c4" : d[2], r: 8, sw: free ? 4 : 2, stroke: free ? "#d9891c" : INK }) + (o.labels === false ? "" : txt(x + i * bw + bw / 2, y + h / 2 + 9, L(d[0], d[1]), LANG === "zh" ? 26 : 17, { a: "middle", fill: INK, raw: true })) + "</g>"; }).join("");

const S = {};
S.s0 = (p) => img("/art/film/walk.jpg", 1 + 0.05 * p, 0.6, 0.4) + `<rect width="1920" height="1080" fill="#1b1524" opacity="0.38"/>` + title(1, 520) + txt(960, 620, L("给每个大学生一个有预算的 AI", "An AI on a budget, for every student"), 46, { a: "middle", fill: "#fff", w: 500 }) + txt(960, 700, L("它是怎么想出来的，量出了什么", "How it was reasoned, and what was measured"), 32, { a: "middle", fill: "#ffffffcc" });

S.s1 = (p) => { let s = "";
  const k0 = 1 - seg(p, 0.1, 0.17); if (k0 > 0) s += img("/art/film/walk.jpg", 1.05 + 0.04 * p, 0.6, 0.4, k0);
  const a = seg(p, 0.13, 0.2); s += `<g opacity="${a}">` + txt(110, 150, L("她的一天", "Her day"), 44, { w: 700 }) + txt(110, 196, "7:00", 24, { fill: SOFT }) + txt(1810, 196, "23:00", 24, { fill: SOFT, a: "end" }) + dayStrip(110, 215, 1700, 96, seg(p, 0.15, 0.36)) + "</g>";
  const fr = seg(p, 0.34, 0.4); s += txt(1502, 372, L("自己能安排的", "what is left to her"), 30, { a: "middle", fill: "#b26a00", w: 600, op: fr });
  // the campus keeps dropping cards
  const n = Math.floor(seg(p, 0.38, 0.7) * 150), sweep = 0; s += `<g>`;
  for (let i = 0; i < n; i++) { const col = i % 15, row = Math.floor(i / 15), x = 140 + col * 110 + rnd(i) * 22, y = 1000 - row * 52 - rnd(i + 9) * 10, r = (rnd(i + 3) - 0.5) * 16; s += `<g transform="rotate(${r} ${x + 48} ${y + 20})">` + box(x, y, 96, 40, { fill: ["#fff", "#fdf3d8", "#efe8fb", "#e8f3ea"][i % 4], r: 6, sw: 2 }) + ln(x + 10, y + 14, x + 70, y + 14, { sw: 3, op: 0.5 }) + ln(x + 10, y + 26, x + 50, y + 26, { sw: 3, op: 0.25 }) + "</g>"; }
  s += "</g>" + txt(110, 470, L("同一天，校园里", "The same day, on campus"), 40, { w: 700, op: seg(p, 0.38, 0.44) });
  // the AI that never runs out
  const c = seg(p, 0.7, 0.76); if (c > 0) { s += `<rect x="0" y="380" width="1920" height="700" fill="#faf8f5" opacity="${c * 0.93}"/>` + txt(110, 470, L("她去问 AI", "She asks an AI"), 40, { w: 700, op: c });
    const rows = L(["周四晚 7 点，图书馆 5 楼", "主办：研究生写作中心", "需要提前报名", "免费，提供晚餐", "周五下午 3 点，学生中心 204", "讲者：一位知名教授", "名额 40 人"], ["Thursday 7 pm, library, 5th floor", "Hosted by the graduate writing center", "Sign-up required", "Free, dinner provided", "Friday 3 pm, student center 204", "Speaker: a well-known professor", "40 seats"]);
    rows.forEach((r, i) => { const on = seg(p, 0.75 + i * 0.022, 0.78 + i * 0.022), bad = [3, 5, 6].includes(i), b = bad ? seg(p, 0.93, 0.97) : 0; const y = 520 + i * 74; s += `<g opacity="${on}">` + box(110, y, 980, 58, { fill: b ? "#fdecea" : "#fff", stroke: b ? RED : INK, sw: 2.5, r: 29, dash: b ? "10 8" : null }) + txt(140, y + 39, r, 30) + txt(1120, y + 39, b ? L("页面上没有这句", "not on any page") : L("听上去很确定", "sounds sure"), 28, { fill: b ? RED : SOFT, w: b ? 700 : 500 }) + "</g>"; }); }
  return s; };

const desk3 = (k, stamps = 0) => { let s = `<ellipse cx="960" cy="930" rx="760" ry="70" fill="#efe6d6" opacity="${k}"/>`; for (let i = 0; i < 3; i++) { const a = seg(k, i * 0.2, 0.5 + i * 0.2), x = 430 + i * 380, y = lerp(1150, 560, a); s += `<g transform="rotate(${(i - 1) * 3} ${x + 150} ${y + 180})">` + box(x, y, 300, 360, { fill: "#fff", r: 18 }) + box(x + 24, y + 24, 252, 120, { fill: ["#fdf3d8", "#efe8fb", "#e8f3ea"][i], r: 10, sw: 2 }) + [0, 1, 2, 3].map((j) => ln(x + 30, y + 185 + j * 40, x + 30 + [200, 150, 180, 120][j], y + 185 + j * 40, { sw: 6, op: 0.28 }) + (stamps > 0 ? tick(x + 262, y + 185 + j * 40, 20, seg(stamps, (i * 4 + j) / 14, (i * 4 + j + 2) / 14)) : "")).join("") + "</g>"; } return s; };
S.s2 = (p) => { let s = ""; const out = seg(p, 0.02, 0.3);
  for (let i = 0; i < 150; i++) { const col = i % 15, row = Math.floor(i / 15), x = 140 + col * 110 + rnd(i) * 22 + out * (1400 + rnd(i) * 900), y = 1000 - row * 52 - out * rnd(i + 5) * 300; s += box(x, y, 96, 40, { fill: "#fff", r: 6, sw: 2, op: 1 - out }); }
  s += desk3(seg(p, 0.25, 0.75), seg(p, 0.7, 0.98));
  s += txt(960, 250, L("如果它和她一样，一天只有一点点可以花", "What if it had as little to spend in a day as she does"), 52, { a: "middle", w: 700, op: seg(p, 0.3, 0.42) }) + txt(960, 330, L("而且每句话都拿得出出处？", "and a source for every word it says?"), 52, { a: "middle", w: 700, op: seg(p, 0.55, 0.67) });
  return s; };

S.s3 = (p) => { let s = ""; const col = [320, 960, 1600];
  const H = [[L("有限，才会选", "A limit makes it choose"), L("三件核对过的 > 一千条", "3 checked finds > a list of 1,000")], [L("逐字段对着原页核对", "Every field checked against its page"), L("错的会更少", "fewer wrong facts")], [L("先封好猜测，再对答案", "Seal a guess, then score it"), L("学你怎么选，不贴标签", "learn how you choose, no labels")]];
  [0.04, 0.34, 0.62].forEach((t0, i) => { const a = seg(p, t0, t0 + 0.08), x = col[i]; s += `<g opacity="${a}" transform="translate(0 ${(1 - a) * 30})">` + txt(x, 250, L("假设", "Hypothesis") + " " + (i + 1), 30, { a: "middle", fill: LILAC, w: 700, ls: 3 });
    if (i === 0) s += jar(x - 110, 330, 220, 300, "", Math.round(seg(p, t0 + 0.04, t0 + 0.2) * 10));
    if (i === 1) s += box(x - 130, 320, 260, 320, { fill: "#fff", r: 18 }) + [0, 1, 2, 3, 4].map((j) => ln(x - 100, 370 + j * 52, x - 100 + [150, 110, 130, 90, 120][j], 370 + j * 52, { sw: 7, op: j === 3 && p > t0 + 0.22 ? 0.1 : 0.3 }) + (j === 3 ? "" : tick(x + 90, 370 + j * 52, 22, seg(p, t0 + 0.06 + j * 0.03, t0 + 0.1 + j * 0.03)))).join("");
    if (i === 2) { const o = seg(p, t0 + 0.2, t0 + 0.3); s += box(x - 150, 380, 300, 200, { fill: "#fff", r: 12 }) + `<path d="M${x - 150} 380 L${x} ${lerp(500, 300, o)} L${x + 150} 380" fill="${o > 0.5 ? "#fff" : "#f6efe2"}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>` + dot(x, 480, 22, RED, { op: 1 - o, stroke: INK, sw: 3 }); }
    s += txt(x, 740, H[i][0], 40, { a: "middle", w: 700 }) + txt(x, 795, H[i][1], 30, { a: "middle", fill: SOFT }) + "</g>"; });
  return s; };

S.s5a = (p) => { let s = ""; const big = 1 - seg(p, 0.34, 0.46), n = Math.round(seg(p, 0.04, 0.3) * 1500);
  if (big > 0.02) s += `<g opacity="${big}">` + star(960, 500, lerp(120, 300, seg(p, 0, 0.1)), { sw: 5 }) + txt(960, 520, n.toLocaleString("en-US"), 96, { a: "middle", w: 800 }) + txt(960, 575, "token", 36, { a: "middle", fill: SOFT }) + txt(960, 900, L("一颗星 ≈ 1,500 个 token，模型读写一千来个字", "One Gem Star ≈ 1,500 tokens: about a thousand words read or written"), 40, { a: "middle", op: seg(p, 0.14, 0.22) }) + "</g>";
  const j = seg(p, 0.42, 0.5); if (j > 0) { const drop = seg(p, 0.5, 0.86) * 10; s += `<g opacity="${j}">` + jar(560, 380, 300, 420, L("替你花的", "for you"), Math.min(6, Math.floor(drop)), {}) + jar(1060, 380, 300, 420, L("它自己的", "its own"), cl(Math.floor(drop) - 6, 0, 4), { fill: "#c9b3ff" }) + txt(960, 250, L("每天十颗", "Ten a day"), 64, { a: "middle", w: 800 }) + txt(710, 960, Math.min(6, Math.floor(drop)) + "", 80, { a: "middle", w: 800, fill: "#b26a00" }) + txt(1210, 960, cl(Math.floor(drop) - 6, 0, 4) + "", 80, { a: "middle", w: 800, fill: LILAC }) + "</g>"; }
  return s; };

// the room as five places where stars get spent
const PLACES = () => [[L("出门找东西", "Go out and look"), 3, "door"], [L("计划今天", "Plan the day"), 2, "think"], [L("写日记", "Write the diary"), 1, "desk"], [L("动动房间", "Change the room"), 1, "room"], [L("写一首歌", "Write a song"), 6, "song"]];
const icon = (kind, x, y) => kind === "door" ? box(x - 50, y - 90, 100, 170, { fill: "#c8935f", r: 8 }) + dot(x + 28, y, 8, GOLD, { stroke: INK, sw: 2 }) : kind === "think" ? dot(x, y - 20, 62, "#fff", { stroke: INK, sw: 3 }) + dot(x - 50, y + 55, 14, "#fff", { stroke: INK, sw: 3 }) + dot(x - 72, y + 82, 8, "#fff", { stroke: INK, sw: 3 }) + [0, 1, 2].map((i) => dot(x - 26 + i * 26, y - 20, 7, INK)).join("") : kind === "desk" ? box(x - 80, y - 10, 160, 22, { fill: "#e9d3b0", r: 4 }) + ln(x - 66, y + 12, x - 66, y + 80) + ln(x + 66, y + 12, x + 66, y + 80) + box(x - 34, y - 60, 68, 50, { fill: "#fff", r: 4 }) + ln(x - 22, y - 42, x + 20, y - 42, { sw: 3, op: 0.4 }) + ln(x - 22, y - 28, x + 8, y - 28, { sw: 3, op: 0.4 }) : kind === "room" ? `<path d="M${x - 80} ${y + 70} L${x - 80} ${y - 30} L${x} ${y - 90} L${x + 80} ${y - 30} L${x + 80} ${y + 70} Z" fill="#e8f3ea" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>` + box(x - 22, y + 4, 44, 66, { fill: "#fff", r: 4 }) : dot(x - 26, y + 50, 24, INK) + dot(x + 44, y + 30, 24, INK) + ln(x - 4, y + 50, x - 4, y - 70, { sw: 7 }) + ln(x + 66, y + 30, x + 66, y - 90, { sw: 7 }) + ln(x - 4, y - 70, x + 66, y - 90, { sw: 12 });
S.s5b = (p) => { let s = "", P = PLACES(); const jy = 250, spent = [0.06, 0.2, 0.32, 0.41, 0.5];
  const left = (i) => 1 - seg(p, spent[i], spent[i] + 0.07), nYou = 3 + Math.round(3 * left(0)), nOwn = Math.round(2 * left(1) + left(2) + left(3));
  s += `<g opacity="${1 - seg(p, 0.66, 0.7)}">` + jar(770, 150, 170, 200, "", nYou) + jar(980, 150, 170, 200, "", nOwn, { fill: "#c9b3ff" }) + "</g>";
  P.forEach(([name, cost, kind], i) => { const x = 250 + i * 355, t0 = spent[i], a = seg(p, t0 - 0.03, t0 + 0.02), fly = seg(p, t0, t0 + 0.09); s += `<g opacity="${0.25 + 0.75 * a}">` + icon(kind, x, 600) + txt(x, 760, name, 36, { a: "middle", w: 700 }) + "</g>";
    for (let k = 0; k < cost; k++) { const f = seg(fly, k / (cost + 2), (k + 3) / (cost + 2)); const jx = i === 0 ? 855 : 1065; if (f > 0) s += star(lerp(jx, x - (cost - 1) * 24 + k * 48, f), lerp(jy + 60, 860, f) - Math.sin(f * Math.PI) * 120, 22, { fill: i === 4 ? "#c9b3ff" : i === 0 ? GOLD : i ? "#c9b3ff" : GOLD, op: i === 4 && k >= 4 ? 0.35 + 0.65 * seg(p, 0.58, 0.64) : 1 }); }
    s += txt(x, 950, cost + (LANG === "zh" ? " 颗" : cost > 1 ? " stars" : " star"), 44, { a: "middle", w: 800, op: seg(p, t0 + 0.07, t0 + 0.1) }); });
  s += txt(140, 240, L("每件事都有价钱", "Everything has a price"), 54, { w: 800, op: 1 - seg(p, 0.66, 0.7) });
  s += txt(1670, 1020, L("一天的钱不够，要攒几天", "more than a day's stars: it has to save"), 28, { a: "middle", fill: LILAC, w: 600, op: seg(p, 0.55, 0.6) * (1 - seg(p, 0.66, 0.7)) });
  const z = seg(p, 0.68, 0.76); if (z > 0) s += `<rect width="1920" height="1080" fill="#faf8f5" opacity="${z * 0.94}"/>` + `<g opacity="${z}">` + txt(960, 330, L("不收星星的", "What costs no stars"), 54, { a: "middle", w: 800 }) + box(330, 430, 560, 260, { fill: "#fff", r: 24 }) + txt(610, 540, L("你开口让它做的事", "Anything you ask it to do"), 40, { a: "middle", w: 700 }) + txt(610, 630, "0", 80, { a: "middle", w: 800, fill: GREEN }) + box(1030, 430, 560, 260, { fill: "#fff", r: 24, op: seg(p, 0.8, 0.86) }) + `<g opacity="${seg(p, 0.8, 0.86)}">` + txt(1310, 540, L("查所有 Gemi 共用的底座", "Reading the base all Gemis share"), LANG === "zh" ? 40 : 34, { a: "middle", w: 700 }) + txt(1310, 630, "0", 80, { a: "middle", w: 800, fill: GREEN }) + "</g>" + txt(960, 820, L("星星只管它自己拿主意做的事", "Stars only pay for what it decides to do on its own"), 40, { a: "middle", fill: SOFT, op: seg(p, 0.9, 0.96) }) + "</g>";
  return s; };

const RULES = () => [L("你让它暂停", "you paused it"), L("它正在外面", "it is out"), L("桌上有你没看的东西", "finds are waiting for you"), L("夜里", "it is night"), L("你动了它的房间", "you changed its room"), L("你一阵没来，它对你还没把握", "you were away and it is unsure"), L("今天有事发生，日记没写", "something happened, no diary yet"), L("攒够了", "savings reached the price"), L("正在攒", "it is saving"), L("自己还有星星，没别的事", "a star left, nothing else to do"), L("星星花完了", "no stars left"), L("其他时候", "otherwise")];
S.s5c = (p) => { let s = "", R = RULES(); const shots = [[2, 0.2, L("我带了东西回来。你没看之前，我不再花了。", "I brought things back. I will not spend more until you have looked."), L("站在桌边等你", "waits by the desk")], [3, 0.42, L("夜里了。", "It is night."), L("躺下，灯调暗", "lies down, lamp low")], [5, 0.6, L("我还不够了解你怎么选。我用自己的星星出门。", "I still do not know enough about how you choose. I am going out, on my own stars."), L("走向门口", "walks to the door")], [10, 0.8, L("今天的星星花完了。我休息到明天。", "I have spent today's stars. I will rest until tomorrow."), L("坐在地毯上", "sits on the rug")]];
  let cur = shots[0], scan = 0; for (const sh of shots) if (p >= sh[1] - 0.08) { cur = sh; scan = seg(p, sh[1] - 0.08, sh[1]); }
