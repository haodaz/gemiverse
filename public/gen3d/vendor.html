<!doctype html>
<meta charset="utf-8"><title>Third-party characters (CC0)</title>
<style>html,body{margin:0;height:100%;background:#f3eef8;font:13px system-ui}#lab span{position:fixed;transform:translate(-50%,0);background:#fff;border-radius:8px;padding:2px 8px;font-weight:600}#err{position:fixed;left:8px;bottom:6px;color:#b00;white-space:pre-wrap}</style>
<div id="lab"></div><div id="err"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// A plain viewer for the CC0 character packs we are trying (Kenney Mini Characters, KayKit Adventurers). ?m=kenney/character-female-a,kaykit/Mage&clip=idle
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search), names = (q.get("m") ?? "kaykit/Mage,kaykit/Rogue,kaykit/Rogue_Hooded").split(","), want = (q.get("clip") ?? "idle").toLowerCase();
const err = (m) => (document.getElementById("err").textContent += m + "\n"); addEventListener("error", (e) => err(e.message));
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f3eef8"); scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.7;
scene.add(new THREE.HemisphereLight("#ffffff", "#e9dfd2", 0.9)); const sun = new THREE.DirectionalLight("#fff1dd", 2); sun.position.set(3, 6, 5); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.18 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 100); const controls = new OrbitControls(camera, renderer.domElement);
const loader = new GLTFLoader(), mixers = [], labels = []; let x = -(names.length - 1) * 0.5, clipsSeen = "";
for (const n of names) { try { const g = await loader.loadAsync(`/vendor/${n}.glb`); const o = g.scene; const b = new THREE.Box3().setFromObject(o), h = b.max.y - b.min.y; o.scale.setScalar(1 / h); o.position.set(x, -b.min.y / h, 0);
    o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.frustumCulled = false; } }); scene.add(o);
    if (g.animations.length) { const mx = new THREE.AnimationMixer(o), c = g.animations.find((a) => a.name.toLowerCase().includes(want)) ?? g.animations[0]; mx.clipAction(c).play(); mixers.push(mx); if (!clipsSeen) clipsSeen = g.animations.map((a) => a.name).join(", "); }
    labels.push([n.split("/").pop(), new THREE.Vector3(x, -0.08, 0)]); } catch (e) { err(n + ": " + e.message); } x += 1; }
window.__clips = clipsSeen; camera.position.set(0.6, 0.9, 2.2 + names.length * 0.75); controls.target.set(0, 0.5, 0); controls.update();
const lab = document.getElementById("lab"), spans = labels.map(([t]) => { const s = document.createElement("span"); s.textContent = t; lab.appendChild(s); return s; });
const clock = new THREE.Clock(); renderer.setAnimationLoop(() => { const dt = clock.getDelta(); mixers.forEach((m) => m.update(dt)); labels.forEach(([, p], i) => { const v = p.clone().project(camera); spans[i].style.left = `${(v.x + 1) / 2 * innerWidth}px`; spans[i].style.top = `${(1 - v.y) / 2 * innerHeight}px`; }); renderer.render(scene, camera); });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
