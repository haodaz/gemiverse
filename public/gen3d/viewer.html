<meta charset="utf-8"><title>Gemiverse 3D lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#f3eef8;font:14px system-ui}#ui{position:fixed;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:60vw}button{border:0;border-radius:999px;padding:8px 14px;background:#fff;box-shadow:0 1px 4px #0002;cursor:pointer}#err{position:fixed;bottom:8px;left:8px;color:#b00;white-space:pre-wrap;max-width:90vw}</style>
<div id="ui"><button id="pal">Change colours</button><button id="look">Random look</button><button id="var">Next furniture style</button><button id="arr">Arrange</button><button id="rot" hidden>Rotate</button><button id="reset" hidden>Reset layout</button><span id="say" style="align-self:center;padding:6px 12px;background:#fff;border-radius:999px;box-shadow:0 1px 4px #0002"></span></div><div id="err"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { offered } from "./hidden.js";
import { makeKit } from "./kit.js";
import { buildDoll, LOOKS } from "./doll.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";

window.THREE = THREE; // some generated helpers read THREE from the page
const err = (m) => (document.getElementById("err").textContent += m + "\n");
window.addEventListener("error", (e) => err(e.message));
const load = async (n) => { try { return await import(`./${n}.js`); } catch (e) { err(`${n}: ${e.message}`); return null; } };
const CHAR = new URLSearchParams(location.search).get("char") ?? "hero-person";
const [room, items, character] = await Promise.all(["room", "items", CHAR].map(load));
const kit = makeKit(THREE);
// Embedded in the room page: no test buttons, the school decides the window view and the starting palette.
const Q = new URLSearchParams(location.search), EMBED = Q.has("embed"), SCHOOL = Q.get("school") === "columbia" ? "columbia" : "nyu";
if (EMBED) document.getElementById("ui").style.display = "none";
let windowView = null;
try { windowView = await new THREE.TextureLoader().loadAsync(`/art/window-${SCHOOL}.svg`); windowView.colorSpace = THREE.SRGBColorSpace; } catch (e) { err("window view: " + e.message); }

const BARE = new URLSearchParams(location.search).has("bare");   // bare: no background at all, so the room sits directly on whatever page embeds it
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f6f2ee");
const d = 3.3, a = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-d * a, d * a, d, -d, 0.1, 100);
camera.position.set(9, 8, 9); const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 1.0, 0); controls.update();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight("#fff7ee", "#c9bfe0", 0.5));
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight); gtao.updateGtaoMaterial({ radius: 0.45, distanceExponent: 1.4, thickness: 1.2, scale: 1.1 }); composer.addPass(gtao); composer.addPass(new OutputPass());
const sun = new THREE.DirectionalLight("#fff1dd", 2.2); sun.position.set(6, 10, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); sun.shadow.bias = -0.0004; scene.add(sun);

const PALETTES = [
  { wall: "#f4ebe1", trim: "#ffffff", floor: "#d9a877", primary: "#b8a2e3", secondary: "#f7e7c6", accent: "#f2a7b8", wood: "#c89462", metal: "#d9c08a", fabric: "#b8a2e3" },
  { wall: "#e4eef7", trim: "#ffffff", floor: "#b98a5e", primary: "#8fc1e8", secondary: "#fdf6e8", accent: "#f6c453", wood: "#8a5a3a", metal: "#9aa3ad", fabric: "#8fc1e8" },
  { wall: "#e9f1e4", trim: "#fffaf0", floor: "#e2c9a0", primary: "#7fb48a", secondary: "#f3e1cf", accent: "#e98b6d", wood: "#e2c9a0", metal: "#2f2f35", fabric: "#7fb48a" },
];
// The room is a 4 m x 4 m floor on a 0.25 m grid. A layout is data: item name -> { p:[x,y,z], r: quarter turns, kind }.
// Floor items snap to the grid and may not overlap; wall and surface items keep their place.
const GRID = 0.25;
const DEFAULT_LAYOUT = {
  bed: { p: [-1.4, 0, -0.95], r: 0, kind: "floor" }, wardrobe: { p: [-0.4, 0, -1.7], r: 0, kind: "floor" },
  desk: { p: [0.7, 0, -1.65], r: 0, kind: "floor" }, chair: { p: [0.7, 0, -1.05], r: 2, kind: "floor" },
  shelf: { p: [1.6, 0, -1.8], r: 0, kind: "floor" }, rug: { p: [0.25, 0, 0.5], r: 0, kind: "rug" },
  plant: { p: [1.7, 0, -0.9], r: 0, kind: "floor" }, lamp: { p: [0.25, 0.75, -1.72], r: 0, kind: "surface" },
  diary: { p: [0.95, 0.75, -1.55], r: 0, kind: "surface" }, wallArt: { p: [-1.4, 1.65, -1.97], r: 0, kind: "wall" },
  corkboard: { p: [-1.97, 1.5, -0.7], r: 1, kind: "wall" },

let layout; try { layout = JSON.parse(localStorage.getItem("gemi.layout")) } catch {} layout ??= structuredClone(DEFAULT_LAYOUT);
const saveLayout = () => { try { localStorage.setItem("gemi.layout", JSON.stringify(layout)) } catch {} };
let away = false, held = false;
let pi = SCHOOL === "columbia" ? 1 : 0, vi = 0, world, who, placed = {}, arranging = false, picked = null, lookNow = null;
const grid = new THREE.GridHelper(4, 16, "#5b46e0", "#7c6cf0"); grid.position.y = 0.012; grid.visible = false; scene.add(grid);
const marker = new THREE.BoxHelper(new THREE.Object3D(), "#7c6cf0"); marker.visible = false; scene.add(marker);

  if (world) scene.remove(world); world = new THREE.Group(); scene.add(world); placed = {};
  const p = PALETTES[pi];
  try { if (room) world.add(room.buildRoom(THREE, { wall: p.wall, trim: p.trim, floor: p.floor, floorStyle: ["planks", "herringbone", "carpet"][vi % 3], windowView })); } catch (e) { err("room: " + e.message); }
  if (items) for (const name of Object.keys(layout)) {
    const make = items.ITEMS[name]; if (!make) continue;
    try { const g = make(THREE, { ...p, material: ["wood", "painted", "fabric"][vi % 3], variant: vi % 3 }); g.userData.item = name; placed[name] = g; place(name); world.add(g); } catch (e) { err(`${name}: ${e.message}`); }
  }
  spawn(lookNow); drawState();
}
const HAIR = ["short", "bob", "longStraight", "curly", "ponytail", "afro", "braids", "buzz"], SKIN = ["#f6dcc6", "#f1cfb4", "#e8b796", "#d49a72", "#b9794f", "#a86f4c", "#8d5a3c", "#6b4226"], HAIRC = ["#1f1a1c", "#3b2a22", "#6b4a2f", "#c98b4a", "#a5482f", "#e58fb0", "#5b8fd6", "#c8ccd4"];
// The Gemi is the jointed doll: generated body, clothes, hair and motion library, with the hand-painted face.
let doll = null, spawnId = 0;
const DEFAULT_LOOK = SCHOOL === "columbia" ? LOOKS.kai : LOOKS.mochi;
async function spawn(look) {
  const mine = ++spawnId;
  const r = (a) => a[Math.floor(Math.random() * a.length)];
  lookNow = look ? { ...DEFAULT_LOOK, ...look } : lookNow && look !== null ? lookNow : { ...r(Object.values(LOOKS)), hairStyle: r(["bob", "shortLayered", "longWavy", "ponytail", "twinTails", "curlyMedium", "pixie", "bun"]), top: r(["hoodie", "cardigan", "sweater", "shirt", "tee", "blazer"]), bottom: r(["pleatedSkirt", "trousers", "jeans", "shorts", "longSkirt"]) };
  const d = await buildDoll(THREE, lookNow, kit, err);
  if (!d || mine !== spawnId) return;
  if (who) world.remove(who);
  doll = d; who = d.root; who.scale.setScalar(1.12); who.position.set(0.25, 0, 0.5); who.visible = !away && !arranging; world.add(who); d.express("happy");
}
// What it does when nobody is talking to it: a small loop of walking to a spot and staying there a while.

// ---- The room shows the Gemi's state: nothing here is decoration ---------------------------------------------------------
// desk cards = finds waiting for the student; pins on the corkboard = finds the student kept; two jars = its Gem Stars
// (for you, for itself); a small trophy shelf item per growth stage. The page sends the numbers; the room only draws them.
let stateGroup = null, worldState = { desk: 0, pinned: 0, starsYou: 6, starsSelf: 4, stage: 1 }, mode = "free";
const CARD_COLOURS = ["#ffd9a8", "#c8b4f0", "#a8e0c0", "#a8d4ff", "#ff9fb5", "#ffe08a"];
function starShape() { const sh = new THREE.Shape(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 0.006 : 0.014, a = -Math.PI / 2 + (k * Math.PI) / 5; sh[k ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r); } sh.closePath(); return new THREE.ExtrudeGeometry(sh, { depth: 0.006, bevelEnabled: true, bevelSize: 0.002, bevelThickness: 0.002, bevelSegments: 2 }); }
let STAR_GEO = null;
function jar(count, colour, x) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.12, 32, 1, true), new THREE.MeshPhysicalMaterial({ color: "#ffffff", transparent: true, opacity: 0.28, roughness: 0.05, side: THREE.DoubleSide, clearcoat: 1 })));
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.053, 0.053, 0.014, 32), new THREE.MeshStandardMaterial({ color: "#c89462", roughness: 0.7 })); lid.position.y = 0.067; g.add(lid);
  STAR_GEO ??= starShape(); const mat = new THREE.MeshStandardMaterial({ color: colour, emissive: colour, emissiveIntensity: 0.9, roughness: 0.4 });
  for (let i = 0; i < count; i++) { const st = new THREE.Mesh(STAR_GEO, mat), a = i * 2.4, r = 0.012 + (i % 3) * 0.011; st.position.set(Math.cos(a) * r, -0.05 + i * 0.011 + (i % 2) * 0.004, Math.sin(a) * r); st.rotation.set(i * 0.7, i * 1.3, i); st.userData.spin = 0.4 + (i % 4) * 0.2; g.add(st); }
  if (count) { const l = new THREE.PointLight(colour, 0.12 + 0.03 * count, 0.9); g.add(l); }

}
function drawState() {
  if (stateGroup) world?.remove(stateGroup); if (!world) return; stateGroup = new THREE.Group(); world.add(stateGroup);
  const desk = layout.desk?.p ?? [0.7, 0, -1.65], dx = desk[0], dz = desk[2];
  for (let i = 0; i < Math.min(6, worldState.desk); i++) {   // finds waiting on the desk, fanned out
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.004, 0.18), new THREE.MeshStandardMaterial({ color: CARD_COLOURS[i % 6], roughness: 0.8 })); c.position.set(dx - 0.36 + i * 0.1, 0.757 + i * 0.004, dz + 0.1 + (i % 2) * 0.03); c.rotation.y = (i - 1) * 0.22; c.castShadow = true; c.userData.focus = "desk"; stateGroup.add(c); }
  const board = layout.corkboard?.p ?? [-1.97, 1.5, -0.7];
  for (let i = 0; i < Math.min(12, worldState.pinned); i++) {   // kept finds, pinned to the corkboard
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.11, 0.085), new THREE.MeshStandardMaterial({ color: CARD_COLOURS[(i + 2) % 6], roughness: 0.8 })); c.position.set(board[0] + 0.03, board[1] + 0.13 - Math.floor(i / 4) * 0.13, board[2] - 0.27 + (i % 4) * 0.18); c.rotation.x = ((i * 37) % 9 - 4) * 0.02; c.userData.focus = "board"; stateGroup.add(c);
    const pin = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 8), new THREE.MeshStandardMaterial({ color: "#e0556b", roughness: 0.3 })); pin.position.set(c.position.x + 0.006, c.position.y + 0.045, c.position.z); stateGroup.add(pin); }
  const j1 = jar(worldState.starsYou, "#ffd24a", dx + 0.44), j2 = jar(worldState.starsSelf, "#b89cff", dx + 0.32); j1.position.z = dz - 0.13; j2.position.z = dz - 0.13; stateGroup.add(j1, j2);
  for (let i = 1; i < worldState.stage; i++) { const t = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.07, 5), new THREE.MeshStandardMaterial({ color: "#ffd24a", metalness: 0.6, roughness: 0.3, emissive: "#a87400", emissiveIntensity: 0.2 })); const sh = layout.shelf?.p ?? [1.6, 0, -1.8]; t.position.set(sh[0] - 0.22 + i * 0.12, 1.64, sh[2] + 0.02); stateGroup.add(t); }   // one small trophy per stage reached
}
// ---- Looking closer: click the desk or the corkboard and the camera moves in; the page opens the matching panel -----------
const VIEWS = { room: { target: [0, 1.0, 0], zoom: 1 }, desk: { target: [0.75, 0.82, -1.55], zoom: 2.7 }, board: { target: [-1.6, 1.45, -0.7], zoom: 2.3 }, shelf: { target: [1.55, 1.0, -1.6], zoom: 2.2 }, bed: { target: [-1.35, 0.5, -0.9], zoom: 1.8 } };
let view = VIEWS.room;
function focusOn(name) { view = VIEWS[name] ?? VIEWS.room; tell("focus", VIEWS[name] ? name : "room"); }

const SPOTS = [
  { at: [0.7, -0.6], face: Math.PI, say: "writing in the diary", mood: "thinking", clip: "writeAtDesk" },
  { at: [1.5, -1.25], face: Math.PI, say: "picking a book from the shelf", mood: "awake", clip: "reachShelf" },
  { at: [1.2, -0.3], face: Math.PI, say: "looking out the window", mood: "awake", clip: "idle" },
  { at: [0.25, 0.5], face: 0, say: "stretching", mood: "happy", clip: "stretch" },
  { at: [0.25, 0.5], face: 0, say: "just being here", mood: "happy", clip: "sitDown" },
  { at: [-0.75, 0.2], face: -Math.PI / 2, say: "wondering what you'd like", mood: "unsure", clip: "think" },
  { at: [-1.3, 1.1], face: -Math.PI / 2, say: "about to head out", mood: "awake", clip: "idle" },
];
let goal = null, waitUntil = 0;
function live(t, dt) {
  if (!who || arranging || away || held) return;
  if (!goal && t > waitUntil && mode === "waiting") { goal = { at: [0.3, -0.75], face: 0.5, say: `waiting for you with ${worldState.desk} thing${worldState.desk === 1 ? "" : "s"}`, mood: "happy", clip: "wave" }; doll?.play("walk"); }
  if (!goal && t > waitUntil) { goal = SPOTS[Math.floor(Math.random() * SPOTS.length)]; document.getElementById("say").textContent = "…"; doll?.play("walk"); doll?.express("awake"); }
  if (goal) {
    const dx = goal.at[0] - who.position.x, dz = goal.at[1] - who.position.z, dist = Math.hypot(dx, dz);
    if (dist < 0.03) { who.rotation.y = goal.face; doll?.express(goal.mood); doll?.play(goal.clip ?? "idle"); document.getElementById("say").textContent = goal.say; tell("doing", goal.say); waitUntil = t + 5 + Math.random() * 4; goal = null; }
    else { const step = Math.min(dist, (doll?.walkSpeed("walk") ?? 0.5) * 1.12 * dt); who.position.x += dx / dist * step; who.position.z += dz / dist * step;   // speed matched to the walk cycle so the feet do not slide
      let turn = Math.atan2(dx, dz) - who.rotation.y; turn = Math.atan2(Math.sin(turn), Math.cos(turn)); who.rotation.y += turn * Math.min(1, dt * 8); }
  }
}
// Arrange mode: the same room, with the grid showing. Click an item, then click a floor cell.
const ray = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const boxOf = (name, p, r) => { const g = placed[name], keepP = g.position.clone(), keepR = g.rotation.y; g.position.set(...p); g.rotation.y = r * Math.PI / 2; g.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(g); g.position.copy(keepP); g.rotation.y = keepR; g.updateMatrixWorld(true); return b; };
function fits(name, p, r) {
  const b = boxOf(name, p, r); if (b.min.x < -2.01 || b.max.x > 2.01 || b.min.z < -2.01 || b.max.z > 2.01) return false;
  b.expandByScalar(-0.03);
  return !Object.keys(placed).some((o) => o !== name && layout[o].kind === "floor" && layout[name].kind === "floor" && b.intersectsBox(boxOf(o, layout[o].p, layout[o].r)));
}
function headOnScreen() { const p = new THREE.Vector3(); who.getWorldPosition(p); p.y += 1.25; p.project(camera); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }
renderer.domElement.addEventListener("click", (ev) => {
  if (!arranging && who && who.visible) {
    ray.setFromCamera(new THREE.Vector2(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1), camera);
    if (ray.intersectObject(who, true).length) { held = true; goal = null; who.rotation.y = Math.atan2(camera.position.x - who.position.x, camera.position.z - who.position.z); doll?.express("happy"); doll?.play("wave"); tell("tapped", headOnScreen()); }
    else if (held) { held = false; tell("released"); }
    else { const hit = ray.intersectObjects([...Object.values(placed), ...(stateGroup ? stateGroup.children : [])], true)[0]; let o = hit?.object; while (o && !o.userData.item && !o.userData.focus) o = o.parent;
      const area = o?.userData.focus ?? ({ desk: "desk", diary: "desk", lamp: "desk", chair: "desk", corkboard: "board", wallArt: "board", shelf: "shelf", bed: "bed" })[o?.userData.item];
      focusOn(area && view !== VIEWS[area] ? area : "room"); }
    return;
  }
  if (!arranging) return;
  ray.setFromCamera(new THREE.Vector2(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(Object.values(placed), true)[0];
  let o = hit?.object; while (o && !o.userData.item) o = o.parent;
  if (o && (!picked || o.userData.item !== picked) && ["floor", "rug"].includes(layout[o.userData.item].kind)) { picked = o.userData.item; marker.setFromObject(o); marker.visible = true; return; }
  if (!picked) return;
  const pt = new THREE.Vector3(); if (!ray.ray.intersectPlane(floorPlane, pt)) return;
  const p = [Math.round(pt.x / GRID) * GRID, 0, Math.round(pt.z / GRID) * GRID];
  if (fits(picked, p, layout[picked].r)) { layout[picked].p = p; place(picked); marker.setFromObject(placed[picked]); saveLayout(); document.getElementById("say").textContent = `${picked} moved`; }
  else document.getElementById("say").textContent = "no room there";
});
document.getElementById("arr").onclick = () => { arranging = !arranging; grid.visible = arranging; marker.visible = false; picked = null; if (who) who.visible = !arranging;
  document.getElementById("rot").hidden = document.getElementById("reset").hidden = !arranging; document.getElementById("arr").textContent = arranging ? "Done" : "Arrange";
  document.getElementById("say").textContent = arranging ? "click an item, then a floor cell" : ""; };
document.getElementById("rot").onclick = () => { if (!picked) return; const r = (layout[picked].r + 1) % 4; if (fits(picked, layout[picked].p, r)) { layout[picked].r = r; place(picked); marker.setFromObject(placed[picked]); saveLayout(); } else document.getElementById("say").textContent = "no room to turn"; };
document.getElementById("reset").onclick = () => { layout = structuredClone(DEFAULT_LAYOUT); saveLayout(); picked = null; marker.visible = false; build(); who.visible = false; };
build();
document.getElementById("pal").onclick = () => { pi = (pi + 1) % PALETTES.length; build(); };
document.getElementById("var").onclick = () => { vi++; build(); };
document.getElementById("look").onclick = () => spawn(null);
addEventListener("resize", () => { const a = innerWidth / innerHeight; camera.left = -d * a; camera.right = d * a; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
// The room page tells the room what the Gemi is doing; the room only shows it.
addEventListener("message", (ev) => { const m = ev.data; if (!m || m.source !== "gemiverse") return;
  if (m.type === "away") { away = !!m.value; if (who) who.visible = !away && !arranging; }
  if (m.type === "release") { held = false; doll?.play("idle"); }
  if (m.type === "world" && m.value) { worldState = { ...worldState, ...m.value }; drawState(); }
  if (m.type === "mode") mode = m.value;
  if (m.type === "focus") focusOn(m.value);
  if (m.type === "express" && m.value) doll?.express(m.value);
  if (m.type === "play" && m.value) doll?.play(m.value);
  if (m.type === "arrange") document.getElementById("arr").click();

let last = 0;

  stateGroup?.traverse((o) => { if (o.userData.spin) o.rotation.y += dt * o.userData.spin; }); if (BARE) renderer.render(scene, camera); else composer.render(); });
</script>
