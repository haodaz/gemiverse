<!doctype html>
<meta charset="utf-8"><title>Gemiverse doll</title>
<style>html,body{margin:0;height:100%;background:#f3eef8;font:13px system-ui}#ui{position:fixed;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:90vw}button{border:0;border-radius:999px;padding:6px 12px;background:#fff;box-shadow:0 1px 4px #0002;cursor:pointer}#err{position:fixed;bottom:6px;left:8px;color:#b00;white-space:pre-wrap;max-width:80vw}</style>
<div id="ui"></div><div id="err"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { makeKit } from "./kit.js";
import { buildDoll, LOOKS } from "./doll.js";
import { buildVendorDoll, bodyFor } from "./vendor-doll.js";
const err = (m) => (document.getElementById("err").textContent += m + "\n"); window.addEventListener("error", (e) => err(e.message)); window.addEventListener("unhandledrejection", (e) => err(String(e.reason?.message ?? e.reason)));
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f3eef8");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.75;
const sun = new THREE.DirectionalLight("#fff1dd", 2.2); sun.position.set(2.5, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -0.5 }); sun.shadow.bias = -0.0004; scene.add(sun);
// fill light from the front and from below: without it the underside of every round form (a chin, a cheek) reflects the dark floor of the environment
scene.add(new THREE.HemisphereLight("#ffffff", "#f1e3d6", 1.1)); const fill = new THREE.DirectionalLight("#fff4ea", 0.9); fill.position.set(0, 0.2, 4); scene.add(fill);
const rim = new THREE.DirectionalLight("#cfd8ff", 0.8); rim.position.set(-3, 3, -4); scene.add(rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.ShadowMaterial({ opacity: 0.2 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const kit = makeKit(THREE), dolls = [];
const q = new URLSearchParams(location.search), which = (q.get("looks") ?? "mochi,pip,wide").split(",");
let x = -(which.length - 1) * 0.35;
const custom = q.get("look") ? JSON.parse(q.get("look")) : null;   // ?look={"hairStyle":"bun"} dresses the first doll, for wardrobe thumbnails
for (const name of which) { const vb = custom ? null : bodyFor(name); const d = vb ? await buildVendorDoll(THREE, vb, err) : await buildDoll(THREE, custom ? { ...(LOOKS[name] ?? LOOKS.mochi), ...custom } : LOOKS[name] ?? LOOKS.mochi, kit, err); if (d) { d.root.position.x = x; scene.add(d.root); dolls.push(d); } x += 0.7; }
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.05, 50); camera.position.set(...(q.get("cam") === "side" ? [3.3, 0.7, 0.001] : q.get("cam") === "front" ? [0, 0.62, 3.3] : q.get("cam") === "face" ? [0.25, 0.82, 1.25] : [1.4, 0.95, 2.9]));
if (q.has("cy")) camera.position.set(+(q.get("cx") ?? 0.3), +q.get("cy"), +(q.get("cz") ?? 1.3));
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, q.has("ty") ? +q.get("ty") : q.get("cam") === "face" ? 0.8 : 0.5, 0);
if (dolls[0]?.vendor && q.get("cam") === "face" && !q.has("cy")) { camera.position.set(0.3, dolls[0].headY + 0.06, 1.5); controls.target.set(0, dolls[0].headY, 0); }   // the ready-made body is shorter, so the face shot aims at its head
controls.update();
const ui = document.getElementById("ui");
for (const clip of ["idle", "walk", "sitDown", "squat", "lieDown", "wave", "patHead", "think", "reachShelf", "writeAtDesk", "cheer", "stretch"]) { const b = document.createElement("button"); b.textContent = clip; b.onclick = () => dolls.forEach((d) => d.play?.(clip)); ui.appendChild(b); }
for (const ex of ["awake", "happy", "wink", "squint", "surprised", "star", "heart", "sad", "unsure", "thinking", "asleep"]) { const b = document.createElement("button"); b.textContent = "face: " + ex; b.style.background = "#fff4e0"; b.onclick = () => dolls.forEach((d) => d.express?.(ex)); ui.appendChild(b); }
if (q.has("embed")) { document.documentElement.style.background = document.body.style.background = "transparent"; ui.style.display = "none"; document.getElementById("err").style.display = "none"; scene.background = null; renderer.setClearColor(0x000000, 0);
  const SHOW = (q.get("show") ?? "wave,idle,walk,think,stretch,cheer,idle").split(","), FACES = q.get("face") ? [q.get("face")] : ["happy", "awake", "star", "wink", "thinking", "awake"]; let k = 0;
  const next = () => { dolls.forEach((d) => { d.play?.(SHOW[k % SHOW.length]); d.express?.(FACES[k % FACES.length]); }); k++; }; next(); setInterval(next, 3200); }
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock(); let last = 0;
renderer.setAnimationLoop(() => { const t = clock.getElapsedTime(), dt = t - last; last = t; for (const d of dolls) try { d.update(t, dt); } catch (e) { if (!d.failed) { d.failed = true; err("update: " + e.message); } } renderer.render(scene, camera); });
</script>
